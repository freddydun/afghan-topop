<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Top-up sent — Afghan Top-Up</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body dir="ltr">
  <header>
    <div class="brand">Afghan Top-Up</div>
  </header>
  <main class="container">
    <section class="hero">
      <span class="badge">✅ Success</span>
      <h1 data-i18n="success.title">Top-up sent!</h1>
      <p class="subtitle" data-i18n="success.body">Your payment was received and the top-up is on its way.</p>
    </section>
    <div class="card" style="text-align:center">
      <a href="/" class="submit" style="display:inline-block;text-decoration:none;padding:14px 24px;border-radius:10px;background:var(--accent);color:#1a1300;font-weight:800;" data-i18n="success.back">Send another top-up</a>
    </div>
  </main>
</body>
</html>
